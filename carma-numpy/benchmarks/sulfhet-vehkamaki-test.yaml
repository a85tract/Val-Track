    coagl, coagp, coremasscheck, csolve, downgevapply, downgxfer, evap_ingrp, evap_mono, evapp, freezaerl_koop2000,
    freezaerl_mohler2010, freezaerl_tabazadeh2000, freezdropl, freezglaerl_murray2010, getwetr, growevapl,
    growp, gsolve, hetnucl, hygroscopicity, maxconc, melticel, microfast, microslow, newstate, newstate_calc,
    nsubsteps, pheat, prestep, psolve, setupbins, setupcoag, setupvf_std, step, sulfate_density, sulfate_surf_tens,
    sulfhetnucrate, sulfnuc, sulfnucrate, totalcondensate, tsolve, upgxfer, vaporp_h2so4_ayers1980, wtpct_tabaz,
    zeromicro; kept Fortran (4): carma_create (flat plan: it ALLOCATEs the derived-type arrays f_element,
    f_gas, f_group, f_solute of its dummy carma, which have no flat spelling); carmaelement_create (derived-type
    dummy carma: the call (de)allocates its components); carmagas_create (derived-type dummy carma: the
    call (de)allocates its components); carmagroup_create (derived-type dummy carma: the call (de)allocates
    its components)'
  accepted_run: Slurm job 33422615 (o5w-carma-out), 2026-10-05 05:01:46-05:18:21 UTC, node c3cpu-a9-u9-2;
    reference $ALPINE_SCRATCH/recast-cand/o5w/carma/w/SULFHET_VEHKAMAKI_TEST/o5w/work/runs/pure,
    candidate $ALPINE_SCRATCH/recast-cand/o5w/carma/w/SULFHET_VEHKAMAKI_TEST/o5w/work/runs/o5w;
    record $ALPINE_SCRATCH/recast-cand/o5w/carma/w/SULFHET_VEHKAMAKI_TEST/o5w/work/result_o5w.json
  notes: 'the record (the wave24 acceptance log)
    judged the pair IDENTICAL; server digests job 34238978 (kit/digest_carma.py, 2026-10-16) found the
    same bytes. Re-run: RUNS.md.'
reference:
  model: 'CARMA (Community Aerosol and Radiation Model for Atmospheres): the CARMA wrapper''s regression
    test programs'
  commit_or_tag: CARMA wrapper (ESCOMP/CARMA) 26b30b2738566de5d3979c1b2ccf191dd78c1207 with CARMA_base
    7b12e0cce0f83de0c55682d20c64222cc339dfce in source/base
  provenance: 'the original Fortran program: same staged source, same build flags, same benchmark inputs
    and node class; run by the same kit as the candidate'
acceptance:
  kind: bitwise
  rules:
  - check: file_set_equal
    scope: '{*.txt,*.log}'
    gating: true
  - check: numeric_md5_equal
    scope: '{*.txt,*.log}'
    dump_tool: md5 of the file's bytes
    dump_format: raw bytes (the kit's case.mask is [], so the files are compared byte for byte, nothing
      masked)
    gating: true
  - check: timing_delta_pct
    timers:
    - wall_seconds
    gating: false
    note: wall time of the original vs the translated run; reported, never gates
