# carma-numpy / sulfhet-vehkamaki-test: wave24 in-situ acceptance, original vs translated program (Val-Track `bitwise` run pair).
id: sulfhet-vehkamaki-test
product: carma-numpy
description: 'CARMA SULFHET_VEHKAMAKI_TEST: original vs translated program, 2 output files compared'
case:
  benchmark: 'CARMA wrapper regression test SULFHET_VEHKAMAKI_TEST: main program tests/carma_sulfhet_vehkamaki_test.F90
    (the test''s own driver; no input files), run in an empty directory; it writes carma_sulfhet_vehkamaki_test.txt
    and its standard output is captured as SULFHET_VEHKAMAKI_TEST.exe.log'
  build: 'the wrapper''s Makefile, gfortran block (-ffree-line-length-none -g -fbounds-check -ffpe-trap=zero,invalid,overflow
    -fbacktrace -fopenmp), FORTRAN=''gfortran -fPIC -ffp-contract=off'', make -j1 carma_lib atmosphere_mod.o
    carma_testutils.o SULFHET_VEHKAMAKI_TEST.exe, linked with OpenBLAS 0.3.28 (-lopenblas); original:
    make_project.sh -> $ALPINE_SCRATCH/recast-cand/o5w/carma/pure/SULFHET_VEHKAMAKI_TEST.exe;
    translated: recast.insitu builds the same Makefile in a copy with the staged (cpp-expanded) CARMA_base
    sources spliced over source/base, the bridge object and the f2py extension recast_carma (make_config.py:
    fc_vars FORTRAN, ldflags -fopenmp)'
  run: '$ALPINE_PROJECTS/recast-cand/jobs/o5w/carma/run_case.sh SULFHET_VEHKAMAKI_TEST outermost o5w:
    python -m recast.insitu <w>/config.json <w>/work --label o5w runs the original executable in work/runs/pure
    and the translated program in work/runs/o5w (stdout -> SULFHET_VEHKAMAKI_TEST.exe.log), then compares
    the files'
  environment: Alpine (CU Boulder) acpu partition, milan node c3cpu-a9-u9-2, Slurm; modules gcc/14.2.0
    openmpi/5.0.6 netcdf/4.9.2 cmake/4.2.3 openblas/0.3.28; OMP_NUM_THREADS=1 OMP_STACKSIZE=128M PYTHONWARNINGS=ignore;
    Python 3.12.14, numpy 2.5.3 ($ALPINE_PROJECTS/recast-cand/venv-o5f); default glibc heap
  engine: 783ef4bbb334d8fa39572a13a6f04a9042ab43d2
  translation: 'delegate: outermost (make_config.py, buffer_out_arrays: all); delegated (27): carma_addcoagulation,
    carma_addgrowth, carma_addnucleation, carma_initialize, carmaelement_get, carmagroup_get, carmastate_allocate,
    carmastate_create, carmastate_get, carmastate_getbin, carmastate_getgas, carmastate_getstate, carmastate_setbin,
    carmastate_setgas, carmastate_step, fixcorecol, rhopart, setupatm, setupckern, setupgkern, setupgrow,
    setupnuc, setupvf, smallconc, supersat, vaporp_h2o_murphy2005, vaporp; inside NumPy (51): actdropl,
