# carma-numpy / nuc2test: wave24 in-situ acceptance, original vs translated program (Val-Track `bitwise` run pair).
id: nuc2test
product: carma-numpy
description: 'CARMA NUC2TEST: original vs translated program, 2 output files compared'
case:
  benchmark: 'CARMA wrapper regression test NUC2TEST: main program tests/carma_nuc2test.F90 (the test''s
    own driver; no input files), run in an empty directory; it writes carma_nuc2test.txt and its standard
    output is captured as NUC2TEST.exe.log'
  build: 'the wrapper''s Makefile, gfortran block (-ffree-line-length-none -g -fbounds-check -ffpe-trap=zero,invalid,overflow
    -fbacktrace -fopenmp), FORTRAN=''gfortran -fPIC -ffp-contract=off'', make -j1 carma_lib atmosphere_mod.o
    carma_testutils.o NUC2TEST.exe, linked with OpenBLAS 0.3.28 (-lopenblas); original: make_project.sh
    -> $ALPINE_SCRATCH/recast-cand/o5w/carma/pure/NUC2TEST.exe; translated: recast.insitu builds
    the same Makefile in a copy with the staged (cpp-expanded) CARMA_base sources spliced over source/base,
    the bridge object and the f2py extension recast_carma (make_config.py: fc_vars FORTRAN, ldflags -fopenmp)'
  run: '$ALPINE_PROJECTS/recast-cand/jobs/o5w/carma/run_case.sh NUC2TEST outermost o5w: python -m recast.insitu
    <w>/config.json <w>/work --label o5w runs the original executable in work/runs/pure and the translated
    program in work/runs/o5w (stdout -> NUC2TEST.exe.log), then compares the files'
  environment: Alpine (CU Boulder) acpu partition, milan node c3cpu-a9-u1-2, Slurm; modules gcc/14.2.0
    openmpi/5.0.6 netcdf/4.9.2 cmake/4.2.3 openblas/0.3.28; OMP_NUM_THREADS=1 OMP_STACKSIZE=128M PYTHONWARNINGS=ignore;
    Python 3.12.14, numpy 2.5.3 ($ALPINE_PROJECTS/recast-cand/venv-o5f); default glibc heap
  engine: 783ef4bbb334d8fa39572a13a6f04a9042ab43d2
  translation: 'delegate: outermost (make_config.py, buffer_out_arrays: all); delegated (25): carma_addgrowth,
    carma_addnucleation, carma_initialize, carmaelement_get, carmagroup_get, carmasolute_create, carmastate_allocate,
    carmastate_create, carmastate_getbin, carmastate_getgas, carmastate_getstate, carmastate_setbin, carmastate_setgas,
    carmastate_step, fixcorecol, rhopart, setupatm, setupgkern, setupgrow, setupnuc, setupvf, smallconc,
    supersat, vaporp_h2o_murphy2005, vaporp; inside NumPy (32): actdropl, carma_initializegrowth, coremasscheck,
    downgevapply, downgxfer, evapp, freezaerl_koop2000, freezaerl_mohler2010, freezaerl_tabazadeh2000,
    freezdropl, freezglaerl_murray2010, getwetr, growevapl, growp, gsolve, hetnucl, hygroscopicity, maxconc,
    melticel, microfast, newstate, newstate_calc, nsubsteps, pheat, prestep, psolve, setupbins, setupvf_std,
    step, totalcondensate, upgxfer, zeromicro; kept Fortran (4): carma_create (flat plan: it ALLOCATEs
    the derived-type arrays f_element, f_gas, f_group, f_solute of its dummy carma, which have no flat
    spelling); carmaelement_create (derived-type dummy carma: the call (de)allocates its components);
    carmagas_create (derived-type dummy carma: the call (de)allocates its components); carmagroup_create
    (derived-type dummy carma: the call (de)allocates its components)'
  accepted_run: Slurm job 33422614 (o5w-carma-out), 2026-10-05 05:01:47-05:32:24 UTC, node c3cpu-a9-u1-2;
    reference $ALPINE_SCRATCH/recast-cand/o5w/carma/w/NUC2TEST/o5w/work/runs/pure, candidate
    $ALPINE_SCRATCH/recast-cand/o5w/carma/w/NUC2TEST/o5w/work/runs/o5w; record $ALPINE_SCRATCH/recast-cand/o5w/carma/w/NUC2TEST/o5w/work/result_o5w.json
  notes: 'the record (the wave24 acceptance log)
    judged the pair IDENTICAL; server digests job 34238978 (kit/digest_carma.py, 2026-10-16) found the
    same bytes. Re-run: RUNS.md.'
reference:
  model: 'CARMA (Community Aerosol and Radiation Model for Atmospheres): the CARMA wrapper''s regression
    test programs'
  commit_or_tag: CARMA wrapper (ESCOMP/CARMA) 26b30b2738566de5d3979c1b2ccf191dd78c1207 with CARMA_base
    7b12e0cce0f83de0c55682d20c64222cc339dfce in source/base
  provenance: 'the original Fortran program: same staged source, same build flags, same benchmark inputs
    and node class; run by the same kit as the candidate'
acceptance:
  kind: bitwise
  rules:
  - check: file_set_equal
    scope: '{*.txt,*.log}'
    gating: true
  - check: numeric_md5_equal
    scope: '{*.txt,*.log}'
    dump_tool: md5 of the file's bytes
    dump_format: raw bytes (the kit's case.mask is [], so the files are compared byte for byte, nothing
      masked)
    gating: true
  - check: timing_delta_pct
    timers:
    - wall_seconds
    gating: false
    note: wall time of the original vs the translated run; reported, never gates
