# cosp2-numpy / ukmo: wave24 in-situ acceptance, original vs translated program (Val-Track `bitwise` run pair).
id: "ukmo"
product: "cosp2-numpy"
description: "COSPv2.0 offline driver, UKMO case (cosp_input_um.nc): original vs translated program, 3 output files compared"
case:
  benchmark: >-
    COSPv2.0 offline driver cosp2_test (driver/src/cosp2_test.F90 + cosp2_io.f90) on the shipped UKMO case:
    driver/data/inputs/UKMO/cosp_input_um.nc (153 points, 20 subcolumns, 38 levels; sha256 626db18d06dc6eeae1e9b1eabd6f857c6c1cc9a073ec453e57cf7c491978a618),
    namelists driver/run/cosp2_input_nl.txt (DINPUT made absolute, FINPUT='cosp_input_um.nc', FOUTPUT='cosp2_output_um.nc')
    and driver/run/cosp2_output_nl.txt; single precision as shipped (cosp_kinds: wp = sp). Outputs compared:
    cosp2_output_um.nc, run.log (stdout), run.err (stderr).
  build: >-
    gcc/gfortran 14.2.0, netCDF-Fortran from nf-config (netcdf/4.9.2). Sources: the staged COSPv2.0 tree
    ($S/replay/o1-cosp2/staged/*.f90: cpp with no -D, RTTOV undefined, as build/Makefile.conf; 33 files) + the
    driver (cosp2_io.f90, cosp2_test.F90), compiled in module order.
    Original (pure): gfortran -O3 -ffree-line-length-none -I$(nf-config --includedir) -fPIC -ffp-contract=off
    -fopt-info-vec-optimized -c <file> for each, then gfortran -O3 -o cosp2_test *.o $(nf-config --flibs)
    -Wl,-rpath,$(nf-config --prefix)/lib (pure/cosp2_test md5 2b8c95b7fd6b1199c9919678343cd843).
    Translated (hybrid): python -m recast.insitu config_final.json work_outermost/ --label final builds the same
    files with fflags -O3 -ffree-line-length-none -I<netcdf include> (the builder adds -fPIC -ffp-contract=off),
    ldflags -O3, plus the f2py extension recast_cosp2 (md5 633eda4691d678166ecdc7fe7ebacbde) holding the NumPy
    translation; build 76.7 s, outside the timed runs.
  run: >-
    One Slurm job (kit insitu_cosp2.sbatch, MODE=outermost LABEL=final BASEDIR=final): recast.insitu copies the case
    directory twice (runs/pure, runs/final), removes cosp2_output_um.nc, and runs in each `cosp2_test
    cosp2_input_nl.txt` with stdout > run.log and stderr > run.err: the pure executable, then the translated program
    (the same Fortran main as an f2py extension, launched by the venv's Python, the reached subprograms dispatched to
    NumPy). It compares case.compare = [cosp2_output_um.nc, run.log, run.err] byte for byte, run.log with
    case.mask = ["run\\.log$::^ (Time to |Total time)"] (the driver's cpu_time timer lines dropped).
  environment: >-
    CU Boulder Alpine, partition acpu, qos cpu-normal, constraint milan, node c3cpu-c15-u5-3 (AMD EPYC 7713P),
    1 task, 4 cpus, 16 GB; module purge; module load gcc/14.2.0 openmpi/5.0.6 netcdf/4.9.2 cmake/4.2.3 openblas/0.3.28;
    FC=/curc/sw/install/gcc/14.2.0/bin/gfortran; ulimit -s unlimited; OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
    PYTHONDONTWRITEBYTECODE=1 PYTHONWARNINGS=ignore::RuntimeWarning (NumPy's floating-point warnings off stderr;
    run.err stays compared, unmasked) TMPDIR=$SLURM_TMPDIR XDG_CACHE_HOME=$S/.cache; Python 3.12.14 venv
    $ALPINE_PROJECTS/recast-cand/venv-o5f (NumPy 2.5.3, recast imported from engine-o5f/src, COMMIT.txt 783ef4bb).
    No heap protocol.
  engine: "783ef4bbb334d8fa39572a13a6f04a9042ab43d2"
  translation: >-
    delegate: outermost over the 75 reached subprograms of the case. 42 delegated (called from Fortran, run in
    NumPy), 31 inside NumPy (callees of delegated subprograms), and get_rng_v (counted as running inside scops'
    translation) = 74 of 75 in NumPy; 1 kept Fortran: cosp_simulator ("I/O on a connected unit: open(12),
    read(12, rec=), write(12, rec=)"). The engine also notes get_rng_v "kept Fortran: no caller of it found outside
    the reached set, and no delegated subprogram reaches it". 6,079 Fortran-to-NumPy calls over 37 delegated rows
    (gases 5,814). Lists in ../README.md.
  accepted_run: >-
    Slurm job 33422497 (o5wa-cosp2-final), Alpine, 2026-10-04 23:00:12-23:08:57 MDT (2026-10-05T05:00Z), COMPLETED;
    run root $ALPINE_SCRATCH/recast-cand/o5w/cosp2/final/ (config_final.json md5 86763c61d7847ee77c2e793a6c13fec8,
    work_outermost/result_final.json md5 07b2ca0ac68ea71d82fb041c3cfe5b6c: IDENTICAL 3/3); original outputs in
    work_outermost/runs/pure/, translated in work_outermost/runs/final/. Record: the wave24 acceptance log (cand-o5w). Digested read-only by job 34238988 (2026-10-16).
  notes: >-
    run.log consists only of the driver's 7 timer lines, so after the mask the compared run.log is empty on both sides;
    run.err is empty on both. The verdict rests on cosp2_output_um.nc (6,032,344 bytes, raw md5 equal) and on both runs
    exiting 0 with the same file set. A re-run needs the staged tree $S/replay/o1-cosp2/staged, the unit configs
    $S/replay/o1-cosp2/configs, the built upstream tree $S/o1/cosp2/build_fpc/tree (driver + UKMO input) and the kit
    $S/o5w/cosp2/jobs/ (insitu_cosp2.sbatch, cosp2/make_config.py, cosp2/reached.json); see ../RUNS.md.
reference:
  model: "COSPv2.0 (CFMIP, https://github.com/CFMIP/COSPv2.0), the CFMIP Observation Simulator Package offline driver"
  commit_or_tag: "5eb05e51187dd2d0e448b78c4e6b28e1d6f65493"
  provenance: "the original Fortran program: same staged source, same build flags, same benchmark inputs and node class; run by the same kit as the candidate"
acceptance:
  kind: bitwise
  rules:
    - check: file_set_equal
      scope: "{cosp2_output_um.nc,run.err,run.log}"
      gating: true
    - check: numeric_md5_equal
      scope: "{cosp2_output_um.nc,run.err}"
      dump_tool: "md5 of the file's bytes"
      dump_format: "raw bytes"
      gating: true
    - check: numeric_md5_equal
      scope: "run.log"
      dump_tool: "md5 of the text after the kit's masks (recast.insitu.compare._masked at 783ef4bb: split on \\n, drop every line matching a line regex, re-join with \\n)"
      dump_format: "masked:run\\.log$::^ (Time to |Total time)"
      gating: true
    - check: timing_delta_pct
      timers: ["wall_seconds"]
      gating: false
      note: "wall time of the original vs the translated run; reported, never gates"
