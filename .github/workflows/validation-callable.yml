# A reusable workflow for product repositories: does VALIDATION.md still tell the truth?
#
# A product repository (clubb-jax, PyCAM5, ...) carries a VALIDATION.md that names the
# commit that was validated and the acceptance record here that says so. This checks,
# on every push and pull request over there, that the record exists, that it is about
# that commit, that it says what the file says, and how far HEAD has moved on -- the
# silent rot VALIDATION-ARCHITECTURE.md §4 (layer 2) exists to catch.
#
# In the product repository, .github/workflows/validation.yml:
#
#   name: Validation status
#   on: [push, pull_request]
#   permissions: { contents: read }
#   jobs:
#     status:
#       uses: a85tract/Val-Track/.github/workflows/validation-callable.yml@main
#       secrets: inherit          # CC_TEST_TOKEN, if this repository cannot read Val-Track
#
# Drift (HEAD ahead of the validated commit) is a warning by default and a failure with
# strict: true. To refresh the file's last line, run in the product repository:
#   python <val-track>/correctness/check_validation.py check --evidence-dir <val-track>/evidence --refresh
name: Validation status

on:
  workflow_call:
    inputs:
      validation_file:
        description: path of the product's VALIDATION.md
        type: string
        default: VALIDATION.md
      cc_test_ref:
        description: the Val-Track ref whose evidence/ is the authority
        type: string
        default: main
      strict:
        description: fail when the drift line is missing or stale
        type: boolean
        default: false
    secrets:
      CC_TEST_TOKEN:
        description: a token that can read Val-Track, when the caller's GITHUB_TOKEN cannot
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The product, with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commits ahead of the validated commit are counted

      - name: Val-Track, for its records
        uses: actions/checkout@v4
        with:
          repository: a85tract/Val-Track
          ref: ${{ inputs.cc_test_ref }}
          path: .val-track
          token: ${{ secrets.CC_TEST_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: VALIDATION.md against the record it names
        # Inputs reach the shell through the environment, never through ${{ }}
        # in the script body: the calling repository controls those strings.
        env:
          VALIDATION_FILE: ${{ inputs.validation_file }}
          STRICT: ${{ inputs.strict }}
        run: |
          strict=()
          [ "$STRICT" = true ] && strict=(--strict)
          python .val-track/correctness/check_validation.py check \
            --validation "$VALIDATION_FILE" \
            --product-repo . \
            --evidence-dir .val-track/evidence \
            "${strict[@]}"
