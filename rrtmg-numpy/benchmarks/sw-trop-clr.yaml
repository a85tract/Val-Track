# rrtmg-numpy / sw-trop-clr: wave24 in-situ acceptance, original vs translated program (Val-Track `bitwise` run pair).
id: sw-trop-clr
product: rrtmg-numpy
description: 'RRTMG_SW column model, run_examples_std_atm case TROP-clr: original vs translated program, 2 output files compared'
case:
  benchmark: 'AER RRTMG_SW column model rrtmg_sw.1col (https://github.com/AER-RC/RRTMG_SW 286e84ed14), its own benchmark run_examples_std_atm/script.run_std_atm,
    case TROP-clr (the script''s output_rrtm_TROP-clr): inputs INPUT_RRTM, IN_CLD_RRTM, IN_AER_RRTM exactly as the tcsh script
    leaves them when it reaches the case (kit prep_cases.py -> $ALPINE_SCRATCH/recast-cand/o5w/rrtmg/cases/sw/TROP-clr);
    outputs OUTPUT_RRTM and the printed stdout (run.log).'
  build: 'Original: kit build_rrtmg.sh sw ''FC=gfortran -fPIC -ffp-contract=off'' link (make_rrtmg_sw_linux_pgi''s object
    order; gfortran 14.2.0 -O2 -fdefault-real-8 -fdefault-double-8 -fdefault-integer-8 -ffp-contract=off -fPIC; rrtmg_sw_k_g.f90
    at -O0; rrtatm.f, extra.f with -std=legacy -fallow-argument-mismatch) -> $ALPINE_SCRATCH/recast-cand/o5w/rrtmg/pure/rrtmg_sw
    (md5 5587d3e053d3b61981146ddfe779ca6e), setup job 33422490. Translated: recast.insitu (engine 783ef4bb, venv-o5f) builds
    the f2py extension recast_rrtmg_sw from the same source with the same build_rrtmg.sh and flags (bridge module -O2 -fdefault-real-8
    -fdefault-double-8 -fdefault-integer-8), the main program linked to the NumPy translation of the delegated subprograms;
    built once on MLS-cld6-imca0-icld2 in job 33422491, md5 41ba7e726d4c437044ff8b123ec7b96f.'
  run: 'In the case directory (a copy of $ALPINE_SCRATCH/recast-cand/o5w/rrtmg/cases/sw/TROP-clr): the original program
    `$ALPINE_SCRATCH/recast-cand/o5w/rrtmg/pure/rrtmg_sw > run.log 2> run.err` (runs/pure), then the translated program,
    the same main program rrtmg_sw.1col.f90 with the delegated subprograms in NumPy (runs/outermost); both launched by kit
    run_case.sh sw TROP-clr outermost = `python -m recast.insitu config.json work --label outermost --run-only` over the MLS-cld6-imca0-icld2
    build (BUILD_FROM); recast.insitu then compares OUTPUT_RRTM and run.log byte for byte.'
  environment: 'Alpine (CU Boulder Research Computing), Slurm partition acpu, qos cpu-normal, constraint milan (AMD EPYC Milan);
    modules gcc/14.2.0 openmpi/5.0.6 netcdf/4.9.2 cmake/4.2.3 openblas/0.3.28; GNU Fortran 14.2.0; glibc 2.28; Python 3.12.14
    and NumPy 2.5.3 (as job 33432017''s protocol.json records them) from $ALPINE_PROJECTS/recast-cand/venv-o5f (recast imported
    from engine-o5f/src, COMMIT.txt 783ef4bb); OMP_NUM_THREADS=1. Both runs on the same node in the same job, one after the
    other (pure, then hybrid). Node c3cpu-c9-u12. Default heap: no MALLOC_PERTURB_ / GLIBC_TUNABLES; after the build case,
    the component''s cases ran up to 16 at a time (xargs -P 16) in the 16-cpu job.'
  engine: 783ef4bbb334d8fa39572a13a6f04a9042ab43d2
  translation: 'recast.insitu `delegate: outermost`, the plan 783ef4bb makes under the kit''s unchanged config (insitu.json
    md5 fd4e5f98a413acd64e48d36b473caf4e). Delegated (10, the outermost rows: each is replaced at its Fortran call sites by
    the f2py bridge to its NumPy translation): twist, temper, get_alpha, mcica_subcol_sw, cldprmc_sw, cldprop_sw, rrtmg_sw_ini,
    setcoef_sw, spcvmc_sw, spcvrt_sw. Inside NumPy (24, callees of delegated subprograms): cmbgb16s, cmbgb17, cmbgb18, cmbgb19,
    cmbgb20, cmbgb21, cmbgb22, cmbgb23, cmbgb24, cmbgb25, cmbgb26, cmbgb27, cmbgb28, cmbgb29, generate_stochastic_clouds,
    mixbits, reftra_sw, swaerpr, swatmref, swcldpr, swcmbdat, swdatinit, taumol_sw, vrtqdr_sw. Rows the engine marks kept
    (14): taumol16, taumol17, taumol18, taumol19, taumol20, taumol21, taumol22, taumol23, taumol24, taumol25, taumol26, taumol27,
    taumol28, taumol29, reason ''internal procedure writing host variables sfluxzen, ssi, taug, taur'': they are taumol_sw''s
    internal procedures, not bridged on their own, and run inside taumol_sw''s NumPy translation. The Mersenne Twister functions
    nextstate, getrandomint, getrandomreal, initialize_scalar have no recorder plan (TYPE(randomNumberSequence) interface;
    kit make_config.py NOPLAN) and run in NumPy as callees of mcica_subcol_sw. Kept Fortran among the 52 reached subprograms:
    none. Fortran outside the reach: the main program rrtmg_sw.1col.f90 (input reading, the column loop, the OUTPUT_RRTM writer),
    the input utilities rrtatm.f / extra.f / util_gfortran.f90, and the k-table loaders sw_kgb16..sw_kgb29 (rrtmg_sw_k_g.f90,
    outside the staged tree), which rrtmg_sw_ini''s translation calls as compiled externals through the extension''s symbols.
    NumPy calls in this case: cldprop_sw 1, rrtmg_sw_ini 1, setcoef_sw 1, spcvrt_sw 1.'
  accepted_run: 'Alpine job 33422491 (o5w-a-rrtmg-outer, 2026-10-05 05:01:13-05:05:17Z, node c3cpu-c9-u12); setup job 33422490
    (o5w-a-rrtmg-setup, 2026-10-05 04:59:42-05:01:08Z, node c3cpu-c15-u5-3). Original: $ALPINE_SCRATCH/recast-cand/o5w/rrtmg/sw/outermost/TROP-clr/work/runs/pure;
    translated: $ALPINE_SCRATCH/recast-cand/o5w/rrtmg/sw/outermost/TROP-clr/work/runs/outermost. Record: the wave24 acceptance log (cand-o5w alpine-a, IDENTICAL 2/2).'
  notes: 'Digests: Alpine job 34239083 (kit/digest_rrtmg.py, read-only). Compared files [''OUTPUT_RRTM'', ''run.log''], mask
    []. Re-run: RUNS.md. run.log (the program''s stdout) is empty in both runs: this column case prints nothing to stdout;
    it is compared anyway, as the kit does (md5 of 0 bytes). Written by the program but not in the kit''s comparison (not
    part of this verdict): run.err (equal).'
reference:
  model: AER RRTMG_SW column model (rrtmg_sw.1col), https://github.com/AER-RC/RRTMG_SW (revision committed 2020-03-26T10:36:46-04:00;
    the wave24 source-revision manifest)
  commit_or_tag: 286e84ed14f61e2279ba819f4ce512a30b48f0b3
  provenance: 'the original Fortran program: same staged source, same build flags, same benchmark inputs and node class; run
    by the same kit as the candidate'
acceptance:
  kind: bitwise
  rules:
  - check: file_set_equal
    scope: '{OUTPUT_RRTM,run.log}'
    gating: true
  - check: numeric_md5_equal
    scope: '{OUTPUT_RRTM,run.log}'
    dump_tool: md5 of the file's bytes
    dump_format: raw bytes
    gating: true
  - check: timing_delta_pct
    timers:
    - wall_seconds
    gating: false
    note: wall time of the original vs the translated run; reported, never gates
